plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}


group = mod_group_id
version = mod_version
def statsVersion = providers.gradleProperty('mod_stats_version').get()
if (!(statsVersion ==~ /[A-Za-z0-9][A-Za-z0-9_.-]{0,95}/)) {
    throw new GradleException('mod_stats_version must contain 1-96 letters, digits, dots, underscores or hyphens')
}

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}


minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf('software.bernie.geckolib:geckolib-forge-1.20.1:4.4.7')
}

tasks.named('processResources', ProcessResources).configure {
    // The release JAR includes the ingestion token; only the bot holds DB credentials.
    // Use the existing local sender settings without publishing the token in source control.
    def senderSettings = layout.projectDirectory.file('.local-stats/maniacrev-stats.properties')
    inputs.file(senderSettings)
    from(senderSettings) { into '' }
    doFirst {
        def senderProperties = new Properties()
        senderSettings.asFile.withInputStream { senderProperties.load(it) }
        if (!senderProperties.getProperty('token', '').trim()) {
            throw new GradleException('Bundled statistics sender token is missing')
        }
    }
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            mod_stats_version: statsVersion,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta', 'mod-stats-version.properties']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('verifyNightmareSync', JavaExec) {
    group = 'verification'
    description = 'Checks nightmare HUD synchronization without launching Minecraft.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.maniacrevolution.nightmare.NightmareSyncStateTest'
}

tasks.register('verifyGameSettings', JavaExec) {
    group = 'verification'
    description = 'Checks settings persistence, validation and timer reconfiguration.'
    dependsOn tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.example.maniacrevolution.settings.GameSettingsTest'
}

tasks.named('check') {
    dependsOn tasks.named('verifyNightmareSync')
    dependsOn tasks.named('verifyGameSettings')
}
// ──────────────────────────────────────────────────────────────────

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title": mod_id,
                "Specification-Vendor": mod_authors,
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": project.jar.archiveVersion,
                "Implementation-Vendor": mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
