// Isolated integration checks: gradlew -I tools/engineer-gametest.gradle runGameTestServer --no-daemon
allprojects {
    afterEvaluate {
        minecraft.runs.gameTestServer {
            workingDirectory project.file('run/engineer-tests')
            property 'forge.enabledGameTestNamespaces', 'engineer_tests'
            mods { maniacrev { source sourceSets.test } }
        }
        tasks.matching { it.name == 'runGameTestServer' }.configureEach {
            doFirst {
                project.copy {
                    from project.file('src/test/resources/gameteststructures/scp173_empty.snbt')
                    into project.file('run/engineer-tests/gameteststructures')
                }
            }
        }
    }
}
