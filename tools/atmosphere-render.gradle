// Isolated synthetic scene: compile/run the real Veil shader, save PNGs, then close.
// .\gradlew.bat -I tools/atmosphere-render.gradle runClient --no-daemon
allprojects {
    afterEvaluate {
        def syncAtmosphereShaders = tasks.register('syncAtmosphereProbeShaders', Copy) {
            from(project.file('src/main/resources')) {
                include 'maniacrev.veil-development.mixins.json'
            }
            if (project.hasProperty('atmosphereReference')) {
                def reference = project.file(project.findProperty('atmosphereReferenceDirectory') ?: 'build/atmosphere-perf/original-shaders/pinwheel')
                if (!reference.isDirectory()) {
                    throw new GradleException('Capture the reference pinwheel directory before using -PatmosphereReference')
                }
                from(reference) { into 'assets/maniacrev/pinwheel' }
            } else {
                from(project.file('src/main/resources')) { include 'assets/maniacrev/pinwheel/**' }
            }
            into project.layout.buildDirectory.dir('resources/main')
            mustRunAfter tasks.named('processResources')
        }
        tasks.named('compileTestJava').configure { dependsOn syncAtmosphereShaders }
        tasks.matching { it.name == 'runClient' }.configureEach { dependsOn syncAtmosphereShaders }
        minecraft.runs.client {
            def worldProbe = project.hasProperty('atmosphereWorldProbe')
            def effectsProbe = project.hasProperty('atmosphereEffectsProbe')
            def mapProbe = project.hasProperty('atmosphereMapBenchmark')
            workingDirectory project.file(effectsProbe ? 'run/atmosphere-effects-probe' : mapProbe ? 'run/atmosphere-map-client' : worldProbe ? 'run/atmosphere-world-probe' : 'run/atmosphere-client')
            property 'maniacrev.atmosphere.effectsProbe', effectsProbe.toString()
            property 'maniacrev.atmosphere.renderProbe', (!worldProbe && !mapProbe && !effectsProbe).toString()
            property 'maniacrev.atmosphere.worldProbe', worldProbe.toString()
            property 'maniacrev.atmosphere.benchmark', project.findProperty('atmosphereBenchmark') ?: ''
            property 'maniacrev.atmosphere.lightBenchmark', project.hasProperty('atmosphereLightBenchmark').toString()
            property 'maniacrev.atmosphere.mapBenchmark', project.findProperty('atmosphereMapBenchmark') ?: ''
            property 'maniacrev.atmosphere.mapBenchmarkMode', project.findProperty('atmosphereMapBenchmarkMode') ?: 'HEAVY'
            property 'maniacrev.atmosphere.mapBenchmarkWidth', project.findProperty('atmosphereMapBenchmarkWidth') ?: '3840'
            property 'maniacrev.atmosphere.mapLightBreakdown', project.hasProperty('atmosphereMapLightBreakdown').toString()
            property 'maniacrev.atmosphere.probeWidth', project.findProperty('atmosphereProbeWidth') ?: '0'
            mods { maniacrev { source sourceSets.test } }
            args '--width', mapProbe ? '3840' : '960', '--height', mapProbe ? '2160' : '540'
        }
    }
}
