// .\gradlew.bat -I tools/bong-verify.gradle verifyBongAssets --no-daemon
allprojects {
    afterEvaluate {
        def verifierClasses = layout.buildDirectory.dir('bong-verifier-classes')
        tasks.register('compileBongAssetVerifier', JavaCompile) {
            dependsOn tasks.named('compileJava')
            source = project.files(project.file('src/test/java/org/example/maniacrevolution/client/renderer/BongAssetsTest.java'),
                    project.file('src/test/java/org/example/maniacrevolution/client/renderer/BongThirdPersonPoseTest.java'))
            classpath = sourceSets.main.compileClasspath + sourceSets.main.output.classesDirs
            destinationDirectory = verifierClasses
            options.encoding = 'UTF-8'
        }
        tasks.register('verifyBongAssets', JavaExec) {
            dependsOn tasks.named('compileBongAssetVerifier'), tasks.named('processResources'), tasks.named('extractForesterTestRuntime')
            classpath = files(verifierClasses, sourceSets.main.output.resourcesDir) + sourceSets.main.output.classesDirs + configurations.runtimeClasspath + fileTree(layout.buildDirectory.dir('forester-test-runtime')) { include '**/*.jar' }
            mainClass = 'org.example.maniacrevolution.client.renderer.BongAssetsTest'
        }
    }
}
